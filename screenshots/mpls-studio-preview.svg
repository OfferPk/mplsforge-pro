  <rect x="660" y="130" width="145" height="65" rx="6" fill="#060b17" stroke="#1e2d4d"/>
  <text x="732" y="157" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">1534 B</text>
  <text x="732" y="177" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">TOTAL L2 WIRE</text>

  <rect x="820" y="130" width="165" height="65" rx="6" fill="#060b17" stroke="#10b981"/>
  <text x="902" y="157" fill="#34d399" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">+7700 B</text>
  <text x="902" y="177" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">JUMBO HEADROOM</text>

  <rect x="1000" y="130" width="150" height="65" rx="6" fill="#060b17" stroke="#1e2d4d"/>
  <text x="1075" y="157" fill="#818cf8" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">4 LABELS</text>
  <text x="1075" y="177" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">STACK DEPTH</text>

  <!-- 2. Zero-Trust Audit Banner -->
  <rect x="480" y="225" width="690" height="150" rx="10" fill="#0d1527" stroke="#1e2d4d"/>
  <circle cx="535" cy="300" r="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="3"/>
  <text x="535" y="309" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="900" font-size="24" text-anchor="middle">A+</text>

  <text x="590" y="265" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">MPLS Backbone Zero-Trust Audit: 100 / 100</text>
  <text x="590" y="285" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">Production Zero-Trust Carrier Grade: Resilient to blackholing, desync, and ECMP polarization.</text>

  <!-- Check items -->
  <text x="590" y="315" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&#9989; MTU Sizing: 9216B Jumbo MTU (10/10)</text>
  <text x="890" y="315" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&#9989; LDP-IGP Sync: RFC 5443 Active (10/10)</text>

  <text x="590" y="335" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&#9989; Fast Reroute: TI-LFA Sub-50ms (10/10)</text>
  <text x="890" y="335" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&#9989; Entropy Labels: RFC 6790 Active (10/10)</text>

  <text x="590" y="355" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&#9989; Control Plane: TCP-AO Cryptographic (10/10)</text>
  <text x="890" y="355" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&#9989; Topology Hiding: TTL Disabled (10/10)</text>

  <!-- 3. Wireshark Hex Dump & Synthesis -->
  <rect x="480" y="390" width="690" height="260" rx="10" fill="#0d1527" stroke="#1e2d4d"/>
  <text x="500" y="415" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">RFC 3032 Packet Wireframe (Wireshark Hex Format)</text>

  <rect x="500" y="430" width="650" height="200" rx="6" fill="#040711" stroke="#1e2d4d"/>
  <text x="515" y="455" fill="#38bdf8" font-family="monospace" font-size="11">0000   00 00 5e 00 53 01 00 1a  2b 3c 4d 5e 81 00 00 64   ..^.S...+&lt;M^...d</text>
  <text x="515" y="475" fill="#34d399" font-family="monospace" font-size="11">0010   88 47 03 e8 aa ff 00 00  70 ff 14 8f 20 ff 05 dc   .G......p... ...</text>
  <text x="515" y="495" fill="#c084fc" font-family="monospace" font-size="11">0020   1b ff                                              ..              </text>
  <text x="515" y="525" fill="#94a3b8" font-family="monospace" font-size="10"># L1 Transport Label: 16010 | TC: 5 | S: 0 | TTL: 255 -&gt; Hex: 0x03e8aaff</text>
  <text x="515" y="545" fill="#94a3b8" font-family="monospace" font-size="10"># L2 Entropy Indicator: 7  | TC: 0 | S: 0 | TTL: 255 -&gt; Hex: 0x000070ff</text>
  <text x="515" y="565" fill="#94a3b8" font-family="monospace" font-size="10"># L3 Entropy Label: 84210  | TC: 0 | S: 0 | TTL: 255 -&gt; Hex: 0x148f20ff</text>
  <text x="515" y="585" fill="#94a3b8" font-family="monospace" font-size="10"># L4 VPN Svc (Bottom): 24001 | TC: 5 | S: 1 | TTL: 255 -&gt; Hex: 0x05dc1bff</text>
  <text x="515" y="610" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10">[Multi-Vendor Configs: Cisco IOS-XR &bull; Juniper Junos &bull; Nokia SR-OS &bull; Linux &bull; Prometheus]</text>
</svg>
