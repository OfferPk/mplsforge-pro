  <text x="185" y="477" fill="#34d399" font-family="monospace" font-size="11">Lbl: 24001</text>
  <text x="265" y="477" fill="#94a3b8" font-family="monospace" font-size="11">TC: 5</text>
  <text x="315" y="477" fill="#94a3b8" font-family="monospace" font-size="11">TTL: 255</text>
  <text x="375" y="477" fill="#10b981" font-family="monospace" font-weight="700" font-size="10">S=1</text>

  <rect x="50" y="515" width="380" height="110" rx="6" fill="#091020" stroke="#1e2d4d"/>
