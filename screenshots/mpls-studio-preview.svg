  <text x="60" y="187" fill="#94a3b8" font-family="monospace" font-size="11">Node: NYC-CR-01</text>

  <rect x="250" y="165" width="180" height="34" rx="6" fill="#070c18" stroke="#1e2d4d"/>
  <text x="260" y="187" fill="#94a3b8" font-family="monospace" font-size="11">ID: 198.51.100.1</text>

  <rect x="50" y="215" width="180" height="34" rx="6" fill="#070c18" stroke="#1e2d4d"/>
  <text x="60" y="237" fill="#94a3b8" font-family="monospace" font-size="11">HundredGigE0/0/0/0</text>

