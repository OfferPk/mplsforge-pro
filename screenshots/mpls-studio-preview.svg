  <text x="110" y="56" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="800" font-size="20">MPLSForge Pro</text>
  <text x="260" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">v1.0.0</text>
  <text x="110" y="78" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Zero-Trust MPLS (RFC 3031/3032) Label Stack Studio, MTU Blackhole Auditor &amp; Multi-Vendor Synthesizer</text>

  <!-- Header Badges -->
  <rect x="760" y="47" width="120" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3"/>
