  <!-- LSE Card 1 -->
  <rect x="50" y="295" width="380" height="42" rx="6" fill="#091020" stroke="#1e2d4d"/>
  <text x="65" y="321" fill="#06b6d4" font-family="monospace" font-weight="700" font-size="12">1</text>
  <text x="85" y="321" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11">Transport/IGP</text>
  <text x="185" y="321" fill="#38bdf8" font-family="monospace" font-size="11">Lbl: 16010</text>
  <text x="265" y="321" fill="#94a3b8" font-family="monospace" font-size="11">TC: 5</text>
  <text x="315" y="321" fill="#94a3b8" font-family="monospace" font-size="11">TTL: 255</text>
  <text x="375" y="321" fill="#06b6d4" font-family="monospace" font-size="10">S=0</text>

  <!-- LSE Card 2 -->
  <rect x="50" y="347" width="380" height="42" rx="6" fill="#091020" stroke="#1e2d4d"/>
  <text x="65" y="373" fill="#06b6d4" font-family="monospace" font-weight="700" font-size="12">2</text>
  <text x="85" y="373" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11">Entropy Ind (ELI)</text>
  <text x="185" y="373" fill="#c084fc" font-family="monospace" font-size="11">Lbl: 7 [RSVD]</text>
  <text x="265" y="373" fill="#94a3b8" font-family="monospace" font-size="11">TC: 0</text>
  <text x="315" y="373" fill="#94a3b8" font-family="monospace" font-size="11">TTL: 255</text>
  <text x="375" y="373" fill="#06b6d4" font-family="monospace" font-size="10">S=0</text>

  <!-- LSE Card 3 -->
  <rect x="50" y="399" width="380" height="42" rx="6" fill="#091020" stroke="#1e2d4d"/>
  <text x="65" y="425" fill="#06b6d4" font-family="monospace" font-weight="700" font-size="12">3</text>
  <text x="85" y="425" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11">Entropy (EL)</text>
  <text x="185" y="425" fill="#38bdf8" font-family="monospace" font-size="11">Lbl: 84210</text>
  <text x="265" y="425" fill="#94a3b8" font-family="monospace" font-size="11">TC: 0</text>
  <text x="315" y="425" fill="#94a3b8" font-family="monospace" font-size="11">TTL: 255</text>
  <text x="375" y="425" fill="#06b6d4" font-family="monospace" font-size="10">S=0</text>

