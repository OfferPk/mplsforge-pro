  <!-- 1. MTU Metrics Banner -->
  <rect x="480" y="115" width="690" height="95" rx="10" fill="#0d1527" stroke="#1e2d4d"/>
  <rect x="500" y="130" width="145" height="65" rx="6" fill="#060b17" stroke="#1e2d4d"/>
