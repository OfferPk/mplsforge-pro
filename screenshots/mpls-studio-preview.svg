  <text x="65" y="565" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&bull; LDP-IGP Sync: Active (Hold: 15s) | RFC 5443</text>
  <text x="65" y="588" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&bull; QoS Mode: Pipe (RFC 3270 Decoupled Core EXP)</text>
  <text x="65" y="611" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">&bull; Fast Reroute: TI-LFA Sub-50ms 100% Coverage</text>

